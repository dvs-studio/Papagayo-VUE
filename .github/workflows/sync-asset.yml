name: Verify and Fill Missing Papagayo-NG Files

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papagayo-ng-gap-fill
  cancel-in-progress: false

jobs:
  verify-and-fill:
    name: Verify Upstream and Fill Missing Files
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your existing fork.
      - name: Checkout Papagayo-VUE Fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: true

      # 2. Install synchronization utilities.
      - name: Install Required Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync

      # 3. Clone the official upstream repository.
      - name: Clone Official Morevna Papagayo-NG
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/morevnaproject-org/papagayo-ng.git \
            upstream-papagayo-ng

          echo "Official upstream repository verified."
          echo "Upstream commit:"
          git -C upstream-papagayo-ng log -1 --oneline

      # 4. Verify which files are missing from the full mirror.
      - name: Check Full Upstream Mirror for Missing Files
        id: mirror_check
        run: |
          set -euo pipefail

          mkdir -p papagayo-ng-upstream

          rsync -a \
            --ignore-existing \
            --exclude='.git/' \
            upstream-papagayo-ng/ \
            papagayo-ng-upstream/

          echo "Missing upstream files copied into papagayo-ng-upstream/."

      # 5. Fill gaps in curated assets without replacing existing files.
      - name: Fill Missing Curated Assets
        run: |
          set -euo pipefail

          mkdir -p \
            assets/breakdowns/languages \
            assets/rsrc \
            assets/rsrc/mouths \
            assets/export_templates \
            assets/samples

          # Copy missing breakdown resources.
          if [ -d upstream-papagayo-ng/breakdowns ]; then
            rsync -a \
              --ignore-existing \
              upstream-papagayo-ng/breakdowns/ \
              assets/breakdowns/
          fi

          # Copy missing language resources.
          if [ -d upstream-papagayo-ng/rsrc/languages ]; then
            rsync -a \
              --ignore-existing \
              upstream-papagayo-ng/rsrc/languages/ \
              assets/breakdowns/languages/
          fi

          # Copy missing resource files.
          if [ -d upstream-papagayo-ng/rsrc ]; then
            rsync -a \
              --ignore-existing \
              upstream-papagayo-ng/rsrc/ \
              assets/rsrc/
          fi

          # Copy missing export templates.
          if [ -d upstream-papagayo-ng/export ]; then
            rsync -a \
              --ignore-existing \
              upstream-papagayo-ng/export/ \
              assets/export_templates/
          fi

          # Discover additional export-related files.
          find upstream-papagayo-ng \
            -type f \
            \( -iname '*export*' \
               -o -iname '*synfig*' \
               -o -iname '*opentoons*' \
               -o -iname '*blender*' \
               -o -iname '*moho*' \) \
            \( -name '*.py' \
               -o -name '*.js' \
               -o -name '*.lua' \
               -o -name '*.xml' \
               -o -name '*.json' \
               -o -name '*.template' \) \
            -print0 |
          while IFS= read -r -d '' file; do
            relative="${file#upstream-papagayo-ng/}"
            destination="assets/export_templates/$relative"

            if [ ! -e "$destination" ]; then
              mkdir -p "$(dirname "$destination")"
              cp "$file" "$destination"
              echo "Added missing export resource: $destination"
            fi
          done

          # Copy missing audio samples and Papagayo project files.
          find upstream-papagayo-ng \
            -type f \
            \( -name '*.wav' -o -name '*.pgo' \) \
            -print0 |
          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"
            destination="assets/samples/$filename"

            if [ ! -e "$destination" ]; then
              cp "$file" "$destination"
              echo "Added missing sample: $destination"
            fi
          done

          echo "Missing curated resources copied where available."

      # 6. Report what is present and what was added.
      - name: Verify Final Files
        run: |
          set -euo pipefail

          echo "======================================"
          echo "FULL UPSTREAM MIRROR"
          echo "======================================"

          find papagayo-ng-upstream \
            -type f | sort | head -200

          echo "======================================"
          echo "CURATED ASSET COUNTS"
          echo "======================================"

          for directory in \
            assets/breakdowns \
            assets/rsrc \
            assets/export_templates \
            assets/samples; do

            if [ -d "$directory" ]; then
              printf '%s: ' "$directory"
              find "$directory" -type f | wc -l
            fi
          done

      # 7. Commit only newly added files.
      - name: Commit Missing Files
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            papagayo-ng-upstream/ \
            assets/

          if git diff --cached --quiet; then
            echo "No missing files were found. Nothing to commit."
            exit 0
          fi

          git commit -m \
            "Fill missing Papagayo-NG upstream files and assets"

          git push origin HEAD:master

          echo "Gap-filling synchronization completed successfully."
