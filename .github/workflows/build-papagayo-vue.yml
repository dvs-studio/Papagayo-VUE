name: Build Papagayo-VUE for Windows

on:
  workflow_dispatch:
    inputs:
      entry_file:
        description: "Python desktop application's entry file (e.g. main.py)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Desktop Application
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          } else {
            Write-Host "No requirements.txt found; skipping dependency installation."
          }

      - name: Install build tools
        run: python -m pip install pyinstaller

      - name: Find Python entry point
        id: entry
        shell: pwsh
        env:
          REQUESTED_ENTRY: ${{ inputs.entry_file }}
        run: |
          if ($env:REQUESTED_ENTRY -ne "") {
            if (-not (Test-Path $env:REQUESTED_ENTRY)) {
              throw "Specified entry file not found: $env:REQUESTED_ENTRY"
            }
            $entry = $env:REQUESTED_ENTRY
          } else {
            $candidates = @(
              "main.py",
              "app.py",
              "Papagayo-VUE.py",
              "papagayo_vue.py",
              "src/main.py",
              "src/app.py"
            )

            $entry = $null
            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                $entry = $candidate
                break
              }
            }

            if (-not $entry) {
              throw "Could not identify the Python entry point. Rerun the workflow and enter its path in the entry_file field."
            }
          }

          "path=$entry" >> $env:GITHUB_OUTPUT
          Write-Host "Using entry point: $entry"

      - name: Check Python syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter "*.py" -Recurse |
            Where-Object {
              $_.FullName -notmatch '\\(\.git|\.venv|venv|build|dist|__pycache__)\\'
            }

          if (-not $files) {
            throw "No Python files found."
          }

          foreach ($file in $files) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Python syntax check failed: $($file.FullName)"
            }
          }

      - name: Build Windows executable
        shell: pwsh
        env:
          ENTRY_FILE: ${{ steps.entry.outputs.path }}
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name "Papagayo-VUE" `
            --onedir `
            $env:ENTRY_FILE

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed."
          }

          if (-not (Test-Path "dist/Papagayo-VUE/Papagayo-VUE.exe")) {
            throw "Expected executable
