name: Build Papagayo-VUE for Windows

on:
  workflow_dispatch:
    inputs:
      entry_file:
        description: "Python application entry file, e.g. main.py"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Desktop Application
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install project dependencies."
            }
          } else {
            Write-Host "No requirements.txt found."
          }

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install PyInstaller."
          }

      - name: Detect application entry point
        id: entry
        shell: pwsh
        env:
          REQUESTED_ENTRY: ${{ inputs.entry_file }}
        run: |
          $entry = $env:REQUESTED_ENTRY

          if ([string]::IsNullOrWhiteSpace($entry)) {
            $candidates = @(
              "main.py",
              "app.py",
              "Papagayo-VUE.py",
              "papagayo_vue.py",
              "src/main.py",
              "src/app.py"
            )

            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                $entry = $candidate
                break
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($entry)) {
            throw "Python entry point not found. Rerun the workflow and enter the correct file path in entry_file."
          }

          if (-not (Test-Path $entry -PathType Leaf)) {
            throw "Entry point does not exist: $entry"
          }

          "path=$entry" >> $env:GITHUB_OUTPUT
          Write-Host "Application entry point: $entry"

      - name: Check Python syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter "*.py" -Recurse |
            Where-Object {
              $_.FullName -notmatch '[\\/](.git|.venv|venv|build|dist|__pycache__)[\\/]'
            }

          if (-not $files) {
            throw "No Python files were found."
          }

          foreach ($file in $files) {
            python -m py_compile $file.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "Python syntax check failed: $($file.FullName)"
            }
          }

          Write-Host "Python syntax checks completed."

      - name: Build Windows executable
        shell: pwsh
        env:
          ENTRY_FILE: ${{ steps.entry.outputs.path }}
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Papagayo-VUE" --onedir "$env:ENTRY_FILE"

          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed to build the application."
          }

          $exe = "dist/Papagayo-VUE/Papagayo-VUE.exe"

          if (-not (Test-Path $exe)) {
            throw "Expected executable was not created: $exe"
          }

          Write-Host "Executable created successfully: $exe"

      - name: Include application resources
        shell: pwsh
        run: |
          $target = "dist/Papagayo-VUE"

          $resourceFolders = @(
            "assets",
            "static",
            "templates",
            "web",
            "frontend"
          )

          foreach ($folder in $resourceFolders) {
            if (Test-Path $folder -PathType Container) {
              Copy-Item -Path $folder -Destination $target -Recurse -Force
              Write-Host "Included resource folder: $folder"
            }
          }

          $resourceFiles = @(
            "README.md",
            "LICENSE"
          )

          foreach ($file in $resourceFiles) {
            if (Test-Path $file -PathType Leaf) {
              Copy-Item -Path $file -Destination $target -Force
            }
          }

      - name: Create Windows ZIP package
        shell: pwsh
        run: |
          $appFolder = "dist/Papagayo-VUE"
          $zipFile = "dist/Papagayo-VUE-Windows.zip"

          if (-not (Test-Path "$appFolder/Papagayo-VUE.exe")) {
            throw "Cannot package the application because its executable is missing."
          }

          Compress-Archive -Path $appFolder -DestinationPath $zipFile -Force

          if (-not (Test-Path $zipFile)) {
            throw "Failed to create the Windows ZIP package."
          }

          Write-Host "Windows package created: $zipFile"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Papagayo-VUE-Windows-Build
          path: dist/Papagayo-VUE-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload executable separately
        uses: actions/upload-artifact@v4
        with:
          name: Papagayo-VUE-Windows-Executable
          path: dist
