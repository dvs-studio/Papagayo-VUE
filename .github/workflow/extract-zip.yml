name: Extract Uploaded Zip & Overwrite Repo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type OVERWRITE to confirm that the uploaded zip will replace matching files in the repository"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  extract-and-overwrite:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'OVERWRITE'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the uploaded zip artifact
        uses: actions/download-artifact@v4
        with:
          name: agent-handoff-zip   # The name you must use when uploading the zip as an artifact
          path: /tmp/incoming

      - name: Locate and extract zip
        run: |
          set -euo pipefail

          ZIP_FILE=$(find /tmp/incoming -name "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in the agent-handoff-zip artifact."
            echo "Upload a zip as an artifact named exactly 'agent-handoff-zip' before running this workflow."
            exit 1
          fi

          echo "Found zip: $ZIP_FILE"
          mkdir -p /tmp/extracted
          unzip -o "$ZIP_FILE" -d /tmp/extracted

          echo "Extracted contents:"
          find /tmp/extracted -type f | head -50

      - name: Overwrite repository files
        run: |
          set -euo pipefail

          # Copy everything from the extracted zip into the workspace root,
          # overwriting existing files. This is intentional for AI agent handoff.
          rsync -a --delete-after /tmp/extracted/ ./ || \
            cp -a /tmp/extracted/. ./

          echo "Overwrite complete. Current top-level files:"
          ls -la

      - name: Commit and push the restored state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes after extract – nothing to commit."
          else
            git commit -m "AI agent handoff: restored state from uploaded zip ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin HEAD:main
            echo "Successfully pushed overwritten state to main."
          fi
